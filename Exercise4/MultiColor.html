<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Colour Website</title>
    <style>
        :root {
            --primary-color: rgba(4, 155, 255, 0.816);
            --text-color: white;
            --secondary-color: rgb(0, 217, 255);
        }

        body {
            background-color: var(--secondary-color);
        }

        * {
            margin: 0px;
            padding: 0px;
        }

        nav {
            background-color: rgb(81, 0, 255);
            padding: 12px 0;
        }

        ul li{
            list-style: none;
            display: inline;
            padding: 23px;
            font-weight: bolder;
        }

        ul li a{
            color: var(--text-color)
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Sevices</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
